name: Check

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile scripts
        shell: pwsh
        run: python -m compileall -q skills/rough-cut-wiki-video/scripts
